<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create an account for Forensic Sketch Generator">
    <title>Forensic Sketch Generator — Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ── Minimal Nav ───────────────────────────────────────────────── -->
    <nav class="navbar">
        <a href="/login.html" class="navbar-brand">
            <div class="badge-icon">🔍</div>
            <span>Forensic<span class="highlight">Sketch</span></span>
        </a>
        <div class="nav-status">
            <div class="status-dot"></div>
            <span>Create Account</span>
        </div>
    </nav>

    <!-- ── Auth Container ────────────────────────────────────────────── -->
    <main class="auth-container">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <div class="auth-icon">✨</div>
                <h1>Create Account</h1>
                <p>Join the Forensic Sketch Generator platform</p>
            </div>

            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required minlength="3"
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6"
                        autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Re-enter your password" required
                        autocomplete="new-password">
                </div>

                <button type="submit" id="signup-btn" class="btn btn-primary btn-full btn-lg">
                    ✨ Create Account
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login.html" class="auth-link">Sign in</a></p>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="js/signup.js"></script>
</body>

</html>
